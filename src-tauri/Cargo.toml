[package]
name = "map-scraper"
version = "0.1.0"
description = "Map Scraper - Cào dữ liệu Google Maps"
authors = ["Tidu System"]
edition = "2021"

[lib]
name = "map_scraper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chromiumoxide = { version = "0.7", features = ["tokio-runtime"], default-features = false }
rust_xlsxwriter = "0.80"
rusqlite = { version = "0.31", features = ["bundled"] }  # bundled = SQLite compiled into binary, no DLL needed for .exe
futures = "0.3"
lazy_static = "1.4"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = "0.13.3"
regex = "1.12.3"
lettre = { version = "0.11.22", features = ["tokio1", "tokio1-native-tls"] }
rand = "0.10.1"
